name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test:
    name: Test & Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Verify strict TypeScript types
        run: bun run typecheck

      - name: Build all micro-engines & ESM
        run: bun run build:engines && bun run build:esm

      - name: Build minified CSS
        run: bun run build:css

      - name: Build static site pages
        run: bun run scripts/build-static.ts

      - name: Verify distribution bundle checksums
        run: bun run scripts/verify-checksums.ts

      - name: Run unit test suite
        run: bun test

      - name: Check bundle size budget (<350KB uncompressed total including appz)
        shell: bash
        run: |
          total_size=$(ls -l public/htmx-*.js public/appz.js | awk '{sum += $5} END {print sum}')
          echo "Total uncompressed public JS bundle size: ${total_size} bytes"
          if [ "$total_size" -gt 350000 ]; then
            echo "Bundle size exceeded threshold!"
            exit 1
          fi

  go:
    name: Go vet, build & test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Vet & build stdlib-only native server
        run: |
          go vet server.go
          go build -o hyperstack-server server.go

      - name: Vet & test component DSL module
        working-directory: go
        run: |
          go vet ./...
          go test ./...
