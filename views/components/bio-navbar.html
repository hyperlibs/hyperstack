<!-- 
  Component: bio-navbar.html
  Theme: Light Minimalist PWA
  Purpose: Floating App Navigation Bar (<app-navbar>) for Bio, Feed, Talk & PWA Install
-->
<app-navbar mode="float" behavior="always-visible" 
            class="fixed bottom-3 inset-x-0 mx-auto max-w-md px-4 z-40 flex items-center justify-between">
  <div class="w-full bg-white/90 backdrop-blur-xl border border-slate-200/90 rounded-2xl shadow-xl shadow-slate-900/5 h-16 px-4 flex items-center justify-around">
    <!-- Bio Tab Button -->
    <button onclick="switchTab('bio')" id="nav-btn-bio" 
            class="nav-tab-item flex flex-col items-center gap-1 py-1 px-3 rounded-xl transition-all text-indigo-600 font-bold bg-indigo-50/80">
      <span class="text-base leading-none">🔗</span>
      <span class="text-[10px] tracking-tight">Bio</span>
    </button>

    <!-- Feed Tab Button -->
    <button onclick="switchTab('feed')" id="nav-btn-feed" 
            class="nav-tab-item flex flex-col items-center gap-1 py-1 px-3 rounded-xl transition-all text-slate-400 hover:text-slate-700">
      <span class="text-base leading-none">📝</span>
      <span class="text-[10px] tracking-tight">Feed</span>
    </button>

    <!-- Talk Tab Button -->
    <button onclick="switchTab('talk')" id="nav-btn-talk" 
            class="nav-tab-item flex flex-col items-center gap-1 py-1 px-3 rounded-xl transition-all text-slate-400 hover:text-slate-700">
      <span class="text-base leading-none">💬</span>
      <span class="text-[10px] tracking-tight">Talk</span>
    </button>

    <!-- PWA Install / Share Button -->
    <button onclick="triggerPwaInstall()" id="nav-btn-install" 
            class="flex flex-col items-center gap-1 py-1 px-3 rounded-xl transition-all text-slate-400 hover:text-indigo-600">
      <span class="text-base leading-none">📲</span>
      <span class="text-[10px] tracking-tight">Install</span>
    </button>
  </div>
</app-navbar>
