<!-- 
  Component: bio-navbar.html
  Theme: Ultra-Compact Minimalist Light
  Purpose: Floating App Navigation Bar (<app-navbar>) with 2x Increased Icons & Fonts
           Tabs: Bio, Links, Feed, Talk, Invite
-->
<app-navbar mode="float" behavior="always-visible" 
            class="fixed bottom-3 inset-x-0 mx-auto max-w-sm px-2.5 z-40 flex items-center justify-between">
  <div class="w-full bg-white/95 backdrop-blur-md border border-slate-200/90 rounded-2xl shadow-xl shadow-slate-900/5 h-17 px-1.5 flex items-center justify-around">
    
    <!-- Bio (2x icon & font) -->
    <button onclick="switchTab('bio')" id="nav-btn-bio" 
            class="nav-tab-item flex flex-col items-center gap-1 py-1 px-2.5 rounded-xl transition-all text-indigo-600 font-bold bg-indigo-50/80 active:scale-95">
      <span class="text-2xl leading-none">👤</span>
      <span class="text-xs font-bold tracking-tight">Bio</span>
    </button>

    <!-- Links (2x icon & font) -->
    <button onclick="switchTab('links')" id="nav-btn-links" 
            class="nav-tab-item flex flex-col items-center gap-1 py-1 px-2.5 rounded-xl transition-all text-slate-400 hover:text-slate-700 active:scale-95">
      <span class="text-2xl leading-none">🔗</span>
      <span class="text-xs font-bold tracking-tight">Links</span>
    </button>

    <!-- Feed (2x icon & font) -->
    <button onclick="switchTab('feed')" id="nav-btn-feed" 
            class="nav-tab-item flex flex-col items-center gap-1 py-1 px-2.5 rounded-xl transition-all text-slate-400 hover:text-slate-700 active:scale-95">
      <span class="text-2xl leading-none">📝</span>
      <span class="text-xs font-bold tracking-tight">Feed</span>
    </button>

    <!-- Talk (2x icon & font) -->
    <button onclick="switchTab('talk')" id="nav-btn-talk" 
            class="nav-tab-item flex flex-col items-center gap-1 py-1 px-2.5 rounded-xl transition-all text-slate-400 hover:text-slate-700 active:scale-95">
      <span class="text-2xl leading-none">💬</span>
      <span class="text-xs font-bold tracking-tight">Talk</span>
    </button>

    <!-- Invite (2x icon & font) -->
    <button onclick="openInviteModal()" id="nav-btn-invite" 
            class="flex flex-col items-center gap-1 py-1 px-2.5 rounded-xl transition-all text-slate-400 hover:text-indigo-600 active:scale-95">
      <span class="text-2xl leading-none">👥</span>
      <span class="text-xs font-bold tracking-tight">Invite</span>
    </button>

  </div>
</app-navbar>
