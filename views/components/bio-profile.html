<!-- 
  Component: bio-profile.html
  Theme: Ultra-Compact Minimalist Light
  Usage: Mobile-first Link-in-Bio profile header with compact avatar, moniker, bio, and social links
-->
<div hx-ext="reactive" hx-state="{ isVerified: true }" 
     class="p-3 bg-white border border-slate-200/80 rounded-2xl shadow-xs">
  <div class="flex items-center gap-3">
    <!-- Compact Avatar -->
    <div class="relative shrink-0">
      <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=140&q=80" 
           alt="Alex Rivera" class="w-12 h-12 rounded-full object-cover border border-slate-200" />
      <span class="w-3.5 h-3.5 rounded-full bg-blue-500 text-white text-[8px] font-bold absolute -bottom-0.5 -right-0.5 flex items-center justify-center border border-white" title="Verified Creator">✓</span>
    </div>

    <!-- Name & Moniker -->
    <div class="flex-1 min-w-0">
      <div class="flex items-center justify-between">
        <h1 class="text-sm font-bold text-slate-900 truncate">Alex Rivera</h1>
        <button onclick="navigator.clipboard.writeText(window.location.href); alert('Profile link copied!');" 
                title="Share Profile"
                class="text-[11px] text-slate-500 hover:text-slate-900 px-2 py-0.5 rounded-md hover:bg-slate-100 transition-colors flex items-center gap-1">
          <span>🔗</span> <span>Share Profile</span>
        </button>
      </div>
      <p class="text-[11px] font-mono text-indigo-600 font-medium">@alex_hyperstack</p>
      <p class="text-[11px] text-slate-600 truncate mt-0.5">Systems Architect • Building Hyperstack (Zero VDOM)</p>
    </div>
  </div>

  <!-- Inline Socials Strip -->
  <div class="mt-2.5 pt-2 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
    <div class="flex items-center gap-3">
      <a href="https://github.com/hyperlibs/hyperstack" target="_blank" rel="noopener noreferrer" class="hover:text-slate-900 transition-colors" title="GitHub">🐙 GitHub</a>
      <a href="https://x.com/" target="_blank" rel="noopener noreferrer" class="hover:text-slate-900 transition-colors" title="Twitter / X">𝕏 Twitter</a>
      <a href="https://linkedin.com/" target="_blank" rel="noopener noreferrer" class="hover:text-slate-900 transition-colors" title="LinkedIn">💼 LinkedIn</a>
    </div>
    <a href="mailto:alex@hyperstack.dev" class="text-indigo-600 font-medium hover:underline text-[11px]">alex@hyperstack.dev</a>
  </div>
</div>
