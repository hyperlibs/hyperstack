<!-- 
  Component: bio-profile.html
  Theme: Light Minimalist
  Usage: Mobile-first Link-in-Bio profile header with avatar, bio, and social links
-->
<div hx-ext="reactive" hx-state="{ isVerified: true }" 
     class="flex flex-col items-center text-center p-6 bg-white border border-slate-200 rounded-3xl shadow-sm">
  <!-- Avatar -->
  <div class="relative mb-3">
    <div class="w-24 h-24 rounded-full p-1 bg-gradient-to-tr from-indigo-500 to-purple-600 shadow-md">
      <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=280&q=80" 
           alt="Alex Rivera" class="w-full h-full rounded-full object-cover border-2 border-white" />
    </div>
  </div>

  <!-- Name & Verified Badge -->
  <div class="flex items-center gap-1.5 justify-center mb-0.5">
    <h1 class="text-xl font-bold text-slate-900 tracking-tight">Alex Rivera</h1>
    <span class="inline-flex items-center justify-center w-4 h-4 rounded-full bg-blue-500 text-white text-[10px] font-bold shadow-sm" title="Verified Creator">✓</span>
  </div>
  <p class="text-xs font-mono font-medium text-indigo-600 mb-2">@alex_hyperstack</p>

  <!-- Tagline / Bio -->
  <p class="text-xs text-slate-600 max-w-xs mb-4 leading-relaxed font-normal">
    Systems Architect & Open Source Creator. Building lean hyperreactive web systems with zero Virtual DOM.
  </p>

  <!-- Social Icons Strip -->
  <div class="flex items-center justify-center gap-2 mb-4 flex-wrap">
    <a href="https://github.com/hyperlibs/hyperstack" target="_blank" rel="noopener noreferrer" 
       class="w-9 h-9 rounded-full bg-slate-100 hover:bg-slate-200 border border-slate-200 flex items-center justify-center text-sm text-slate-700 transition-colors"
       title="GitHub">🐙</a>
    <a href="https://x.com/" target="_blank" rel="noopener noreferrer" 
       class="w-9 h-9 rounded-full bg-slate-100 hover:bg-slate-200 border border-slate-200 flex items-center justify-center text-sm text-slate-700 transition-colors"
       title="X / Twitter">𝕏</a>
    <a href="https://linkedin.com/" target="_blank" rel="noopener noreferrer" 
       class="w-9 h-9 rounded-full bg-slate-100 hover:bg-slate-200 border border-slate-200 flex items-center justify-center text-sm text-slate-700 transition-colors"
       title="LinkedIn">💼</a>
    <a href="https://youtube.com/" target="_blank" rel="noopener noreferrer" 
       class="w-9 h-9 rounded-full bg-slate-100 hover:bg-slate-200 border border-slate-200 flex items-center justify-center text-sm text-slate-700 transition-colors"
       title="YouTube">▶</a>
    <a href="mailto:alex@hyperstack.dev" 
       class="w-9 h-9 rounded-full bg-slate-100 hover:bg-slate-200 border border-slate-200 flex items-center justify-center text-sm text-slate-700 transition-colors"
       title="Email">✉️</a>
  </div>

  <!-- Share Bio Button -->
  <button onclick="navigator.clipboard.writeText(window.location.href); alert('Profile link copied to clipboard!');"
          class="w-full py-2.5 px-4 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-medium text-xs shadow-sm transition-colors flex items-center justify-center gap-1.5">
    <span>🔗</span> <span>Share Profile</span>
  </button>
</div>
