<!-- 
  Component: bio-tipjar.html
  Configurable State: tipAmount (number), totalReceived (number)
  Usage: Procedural micro-patronage and tip jar card with haptic & shockwave feedback
-->
<div hx-ext="reactive" hx-state="{ tipAmount: 15, totalReceived: 240 }" 
     class="p-6 rounded-3xl bg-slate-900/90 border border-slate-800 flex flex-col items-center text-center shadow-xl">
  <div class="w-14 h-14 rounded-2xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-center text-2xl mb-3 text-amber-400">
    ☕
  </div>
  <h3 class="font-extrabold text-base text-white mb-1">Fuel the Open Source Journey</h3>
  <p class="text-xs text-slate-400 max-w-xs mb-4">Support development of free, hyperreactive tools like Hyperstack and Hypersheet.</p>

  <div class="grid grid-cols-4 gap-2.5 w-full mb-4">
    <button hx-action="tipAmount = 3; $sound('click')" 
            hx-class="{ 'border-amber-400 bg-amber-500/20 text-white': tipAmount === 3, 'border-slate-800 bg-slate-900 text-slate-300': tipAmount !== 3 }"
            class="p-3 rounded-2xl border flex flex-col items-center justify-center transition-all active:scale-95">
      <span class="text-base font-black">$3</span>
      <span class="text-[10px] text-slate-400">Espresso</span>
    </button>
    <button hx-action="tipAmount = 5; $sound('click')" 
            hx-class="{ 'border-amber-400 bg-amber-500/20 text-white': tipAmount === 5, 'border-slate-800 bg-slate-900 text-slate-300': tipAmount !== 5 }"
            class="p-3 rounded-2xl border flex flex-col items-center justify-center transition-all active:scale-95">
      <span class="text-base font-black">$5</span>
      <span class="text-[10px] text-slate-400">Boba</span>
    </button>
    <button hx-action="tipAmount = 15; $sound('click')" 
            hx-class="{ 'border-amber-400 bg-amber-500/20 text-white': tipAmount === 15, 'border-slate-800 bg-slate-900 text-slate-300': tipAmount !== 15 }"
            class="p-3 rounded-2xl border flex flex-col items-center justify-center transition-all active:scale-95">
      <span class="text-base font-black">$15</span>
      <span class="text-[10px] text-slate-400">Pizza</span>
    </button>
    <button hx-action="tipAmount = 50; $sound('click')" 
            hx-class="{ 'border-amber-400 bg-amber-500/20 text-white': tipAmount === 50, 'border-slate-800 bg-slate-900 text-slate-300': tipAmount !== 50 }"
            class="p-3 rounded-2xl border flex flex-col items-center justify-center transition-all active:scale-95">
      <span class="text-base font-black">$50</span>
      <span class="text-[10px] text-slate-400">Sponsor</span>
    </button>
  </div>

  <button hx-action="$sound('success'); $blast({ radius: 250, force: 30 }); $toast('Thank you for fueling open source! ❤️', 'success')"
          class="w-full py-3 rounded-2xl bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 font-extrabold text-xs text-slate-950 shadow-lg shadow-amber-500/25 active:scale-95 transition-all">
    Send Tip ❤️
  </button>
</div>
