<!-- 
  Component: bio-chat.html
  Configurable State: isTyping (boolean), messageCount (number)
  Usage: In-Bio interactive messenger and Ask-Me-Anything stream
-->
<div hx-ext="reactive" hx-state="{ isTyping: false, messageCount: 1 }" 
     class="flex flex-col h-[480px] rounded-2xl bg-slate-900/90 border border-slate-800 overflow-hidden shadow-2xl">
  <!-- Header -->
  <div class="h-12 px-4 bg-slate-950/80 border-b border-slate-800/80 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-2">
      <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
      <div>
        <h3 class="text-xs font-bold text-white leading-none">Alex Rivera (AMA)</h3>
        <p class="text-[9px] text-slate-400">Replies in under 2 minutes</p>
      </div>
    </div>
    <span class="text-[10px] font-mono px-2 py-0.5 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">Hypermedia Socket</span>
  </div>

  <!-- Messages -->
  <div class="flex-1 overflow-y-auto p-4 space-y-3" id="bio-chat-messages">
    <div class="flex items-start gap-2.5 max-w-[85%]">
      <div class="w-7 h-7 rounded-full bg-indigo-600 flex items-center justify-center text-white text-xs font-bold shrink-0">A</div>
      <div class="p-3 rounded-2xl rounded-tl-sm bg-slate-800 border border-slate-700/70 text-xs text-slate-200 leading-relaxed shadow-sm">
        Hey there! Welcome to my Bio Chat. Ask me about Hyperstack, consulting, or open-source projects!
        <div class="text-[9px] text-slate-400 text-right mt-1 font-mono">Just now</div>
      </div>
    </div>
  </div>

  <!-- Quick Prompts -->
  <div class="px-3 py-2 bg-slate-950/50 border-t border-slate-800/60 flex items-center gap-1.5 overflow-x-auto">
    <button class="px-2.5 py-1 rounded-full bg-slate-800 hover:bg-indigo-600 border border-slate-700 text-[10px] text-slate-300 hover:text-white shrink-0">
      🚀 Current Stack?
    </button>
    <button class="px-2.5 py-1 rounded-full bg-slate-800 hover:bg-indigo-600 border border-slate-700 text-[10px] text-slate-300 hover:text-white shrink-0">
      🤝 Hire for Project?
    </button>
  </div>

  <!-- Form -->
  <form class="p-3 bg-slate-950/90 border-t border-slate-800 flex items-center gap-2"
        hx-post="/api/bio/chat" hx-target="#bio-chat-messages" hx-swap="beforeend">
    <input type="text" name="message" placeholder="Ask Alex anything..." required
           class="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white placeholder:text-slate-500 focus:outline-none focus:border-indigo-500" />
    <button type="submit" class="px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs shadow-md shadow-indigo-600/30">
      Send
    </button>
  </form>
</div>
