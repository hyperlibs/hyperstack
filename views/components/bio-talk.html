<!-- 
  Component: bio-talk.html
  Theme: Ultra-Compact Minimalist Light
  Purpose: "Talk - a chat ui where users can talk to my digital clone ai"
-->
<div hx-ext="reactive" hx-state="{ isAnonymous: false }" 
     class="flex flex-col h-[380px] rounded-2xl bg-white border border-slate-200/80 overflow-hidden shadow-2xs">
  
  <!-- Digital Clone Header -->
  <div class="h-10 px-3 bg-slate-50 border-b border-slate-200/70 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-1.5">
      <div class="w-5 h-5 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center text-white text-[9px] font-bold">
        A
      </div>
      <span class="text-xs font-bold text-slate-900">Alex's Clone</span>
      <span class="text-[9px] text-indigo-600 font-mono font-bold bg-indigo-50 px-1 rounded">AI</span>
    </div>

    <!-- Anonymous Toggle -->
    <label class="flex items-center gap-1 cursor-pointer select-none">
      <input type="checkbox" id="anon-checkbox" class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 h-3 w-3"
             hx-model="isAnonymous" />
      <span class="text-[10px] font-medium text-slate-600 flex items-center gap-0.5">
        <span>🎭</span> <span>Ask Anon</span>
      </span>
    </label>
  </div>

  <!-- Chat Messages Stream -->
  <div id="talk-chat-stream" class="flex-1 overflow-y-auto p-2.5 space-y-2 bg-slate-50/40 text-xs">
    <div class="flex items-start gap-1.5 max-w-[92%]">
      <div class="w-5 h-5 rounded-full bg-indigo-600 flex items-center justify-center text-white text-[9px] font-bold shrink-0">A</div>
      <div class="p-2 rounded-xl rounded-tl-xs bg-white border border-slate-200/80 text-xs text-slate-800 leading-snug shadow-2xs">
        Hey! 👋 I'm <strong>Alex's Digital Clone AI</strong>. I answer strictly based on Alex's own personal inputs.
        <p class="text-slate-500 text-[10px] mt-1">Ask me about relationship status, projects, tech stack, or routine!</p>
      </div>
    </div>
  </div>

  <!-- Micro Prompts Chips -->
  <div class="px-2 py-1 bg-white border-t border-slate-200/70 flex items-center gap-1 overflow-x-auto shrink-0 scrollbar-none">
    <button onclick="sendClonePrompt('Do you have a girlfriend?')" 
            class="px-2 py-0.5 rounded-full bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 border border-slate-200 text-[10px] font-medium text-slate-700 shrink-0 transition-colors">
      Do you have a girlfriend? 👀
    </button>
    <button onclick="sendClonePrompt('What are your top projects?')" 
            class="px-2 py-0.5 rounded-full bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 border border-slate-200 text-[10px] font-medium text-slate-700 shrink-0 transition-colors">
      Top projects? 🚀
    </button>
    <button onclick="sendClonePrompt('Where do you live?')" 
            class="px-2 py-0.5 rounded-full bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 border border-slate-200 text-[10px] font-medium text-slate-700 shrink-0 transition-colors">
      Where do you live? 📍
    </button>
  </div>

  <!-- Input Form -->
  <form id="talk-form" onsubmit="handleTalkSubmit(event)" 
        class="p-1.5 bg-white border-t border-slate-200/70 flex items-center gap-1.5 shrink-0">
    <input type="text" id="talk-input" placeholder="Ask Alex's clone anything..." required autocomplete="off"
           class="flex-1 bg-slate-50 border border-slate-200/80 rounded-lg px-2.5 py-1 text-xs text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-indigo-500 shadow-2xs" />
    <button type="submit" 
            class="px-3 py-1 rounded-lg bg-slate-900 hover:bg-slate-800 text-white font-semibold text-xs transition-all active:scale-95">
      ➤
    </button>
  </form>
</div>
