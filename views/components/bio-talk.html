<!-- 
  Component: bio-talk.html
  Theme: Light Minimalist
  Purpose: "Talk - a chat ui where users can talk to my digital clone ai. the ai agent will respond only as per my inputs. users can ask anonymously also. like Do you have a girlfriend? AI will look at my answers and say accordingly."
-->
<div hx-ext="reactive" hx-state="{ isAnonymous: false }" 
     class="flex flex-col h-[520px] rounded-3xl bg-white border border-slate-200 overflow-hidden shadow-sm">
  
  <!-- Digital Clone Header -->
  <div class="h-14 px-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between shrink-0">
    <div class="flex items-center gap-2.5">
      <div class="relative">
        <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-indigo-500 to-purple-600 flex items-center justify-center text-white text-xs font-bold shadow-sm">
          A
        </div>
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 absolute -bottom-0.5 -right-0.5 border-2 border-white"></span>
      </div>
      <div>
        <div class="flex items-center gap-1.5">
          <h3 class="text-xs font-bold text-slate-900 leading-none">Alex's Digital Clone</h3>
          <span class="text-[9px] font-mono px-1.5 py-0.2 rounded bg-indigo-50 text-indigo-700 border border-indigo-200 font-bold">AI Agent</span>
        </div>
        <p class="text-[10px] text-slate-500 mt-0.5">Responds strictly as per Alex's verified answers</p>
      </div>
    </div>

    <!-- Anonymous Toggle -->
    <label class="flex items-center gap-1.5 cursor-pointer select-none">
      <input type="checkbox" id="anon-checkbox" class="rounded border-slate-300 text-indigo-600 focus:ring-indigo-500 h-3.5 w-3.5"
             hx-model="isAnonymous" />
      <span class="text-xs font-medium text-slate-600 flex items-center gap-1">
        <span>🎭</span> <span class="hidden sm:inline">Ask</span> <span>Anon</span>
      </span>
    </label>
  </div>

  <!-- Chat Messages Stream -->
  <div id="talk-chat-stream" class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50/50">
    <!-- Initial Greeting -->
    <div class="flex items-start gap-2.5 max-w-[88%]">
      <div class="w-7 h-7 rounded-full bg-indigo-600 flex items-center justify-center text-white text-xs font-bold shrink-0">A</div>
      <div class="p-3 rounded-2xl rounded-tl-sm bg-white border border-slate-200 text-xs text-slate-800 leading-relaxed shadow-sm">
        Hey! 👋 I'm <strong>Alex's Digital Clone AI</strong>. I answer strictly based on Alex's own personal inputs and real answers.
        <p class="text-slate-500 text-[11px] mt-1.5">Feel free to ask me anything — you can even toggle <strong>Anonymous mode</strong> above!</p>
        <div class="text-[9px] text-slate-400 text-right mt-1 font-mono">09:41</div>
      </div>
    </div>
  </div>

  <!-- Quick Prompts Chips -->
  <div class="px-3 py-2 bg-white border-t border-slate-200 flex items-center gap-1.5 overflow-x-auto shrink-0 scrollbar-none">
    <button onclick="sendClonePrompt('Do you have a girlfriend?')" 
            class="px-2.5 py-1 rounded-full bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 hover:border-indigo-200 border border-slate-200 text-xs font-medium text-slate-700 shrink-0 transition-colors">
      Do you have a girlfriend? 👀
    </button>
    <button onclick="sendClonePrompt('What are your top projects?')" 
            class="px-2.5 py-1 rounded-full bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 hover:border-indigo-200 border border-slate-200 text-xs font-medium text-slate-700 shrink-0 transition-colors">
      Top projects? 🚀
    </button>
    <button onclick="sendClonePrompt('Where do you live?')" 
            class="px-2.5 py-1 rounded-full bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 hover:border-indigo-200 border border-slate-200 text-xs font-medium text-slate-700 shrink-0 transition-colors">
      Where do you live? 📍
    </button>
    <button onclick="sendClonePrompt('What tech stack do you use?')" 
            class="px-2.5 py-1 rounded-full bg-slate-100 hover:bg-indigo-50 hover:text-indigo-600 hover:border-indigo-200 border border-slate-200 text-xs font-medium text-slate-700 shrink-0 transition-colors">
      Tech stack? ⚡
    </button>
  </div>

  <!-- Message Input Form -->
  <form id="talk-form" onsubmit="handleTalkSubmit(event)" 
        class="p-3 bg-white border-t border-slate-200 flex items-center gap-2 shrink-0">
    <input type="text" id="talk-input" placeholder="Ask Alex's clone anything..." required autocomplete="off"
           class="flex-1 bg-slate-50 border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-900 placeholder:text-slate-400 focus:outline-none focus:border-indigo-500 focus:bg-white transition-all shadow-inner" />
    <button type="submit" 
            class="px-4 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-semibold text-xs shadow-sm transition-all active:scale-95 flex items-center gap-1">
      <span>Send</span> <span>➤</span>
    </button>
  </form>
</div>
